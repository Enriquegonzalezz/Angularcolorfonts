<div class="min-h-screen bg-dark py-6 flex flex-col justify-center items-center sm:py-12">
  <div class="relative py-3 sm:max-w-6xl sm:mx-auto">
    <div class="absolute inset-0 bg-card border-2 border-green-500 shadow-lg rounded-3xl"></div>
    <div class="relative px-4 py-10 bg-card border-2 border-green-500 shadow-lg rounded-3xl sm:p-12">
      <h1 class="text-2xl font-semibold text-green-400 text-center mb-6">
        Selecciona tus colores
      </h1>
      <div class="flex flex-col lg:flex-row gap-8 items-start justify-center">
        <!-- Colores -->
        <div class="flex-1">
          <div class="mt-6 w-full flex flex-col items-center">
            <div *ngFor="let color of colors; let i = index" class="flex items-center space-x-4 mb-4">
              <label [for]="'color-' + i" class="text-gray-200 font-medium">
                Color {{ i + 1 }}:
              </label>
              <input
                type="color"
                [id]="'color-' + i"
                [name]="'color_' + (i + 1)"
                [value]="color"
                (input)="handleColorChange(i, $any($event.target).value)"
                class="w-8 h-8 rounded-full shadow-inner border-2 border-green-500 bg-[#23272e] cursor-pointer"
              />
              <span class="text-gray-300 font-mono">{{ color }}</span>
            </div>
            <div class="flex justify-between mt-8 gap-4">
              <button
                (click)="editRow !== null ? handleUpdate() : handleSave()"
                class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded border border-green-500 focus:outline-none focus:shadow-outline"
              >
                {{ editRow !== null ? "Actualizar" : "Guardar selección" }}
              </button>
              <button
                (click)="goToHome()"
                class="bg-gray-800 hover:bg-gray-700 text-gray-100 font-bold py-2 px-4 rounded border border-green-500 focus:outline-none focus:shadow-outline flex items-center justify-center"
              >
                Regresar
              </button>
              <button
                (click)="goToFonts()"
                class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded border border-green-500 focus:outline-none focus:shadow-outline"
              >
                Ir a Fuentes
              </button>
            </div>
          </div>
        </div>
        <!-- HeroCard Preview con estructura igual a HeroCards -->
        <div class="flex-1 flex flex-col items-center w-full mt-8 lg:mt-0">
          <div
            class="w-full max-w-[340px] rounded-2xl border-4 shadow-lg p-0 mx-auto transition-all"
            [style.background]="'linear-gradient(135deg, ' + colors[0] + ', ' + colors[1] + ')'"
            [style.color]="colors[2]"
            [style.borderColor]="colors[3]"
            [style.boxShadow]="'0 0 20px 2px ' + colors[4] + '55'"
          >
            <div class="flex flex-row items-center gap-4 p-6 pb-2">
              <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm">
                <div [style.background]="colors[1]" [style.color]="colors[2]" class="w-full h-full rounded-full flex items-center justify-center">
                  EG
                </div>
              </div>
              <div class="flex flex-col">
                <span class="font-bold text-lg" [style.color]="colors[2]">Enrique Gonzalez</span>
                <span class="text-sm" [style.color]="colors[2]">&#64;kikegonza</span>
              </div>
            </div>
            <div class="px-6 pb-4" [style.color]="colors[2]">
              Funciona perfecto!
            </div>
            <div class="px-6 pb-4 flex flex-col items-start">
              <div
                class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2"
                [style.background]="colors[3]"
                [style.color]="colors[1]"
                [style.borderColor]="colors[4]"
              >
                el mas popular
              </div>
              <div class="mt-2">
                <span class="text-3xl font-bold" [style.color]="colors[2]">$0</span>
                <span class="ml-2 text-muted-foreground" [style.color]="colors[2]"> /month</span>
              </div>
              <div class="mt-2 text-sm" [style.color]="colors[2]">
                Lorem ipsum dolor sit, amet ipsum consectetur adipisicing elit.
              </div>
            </div>
            <div class="px-6 pb-4">
              <button
                class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 w-full"
                [style.background]="colors[3]"
                [style.color]="colors[1]"
                [style.borderColor]="colors[4]"
                [style.border]="'2px solid ' + colors[4]"
              >
                Empezar prueba ahora
              </button>
            </div>
            <hr class="w-4/5 m-auto mb-4" [style.borderColor]="colors[4]" />
            <div class="px-6 pb-6">
              <div class="space-y-2">
                <div *ngFor="let benefit of ['4 Team member', '4 GB Storage', 'Upto 6 pages']" class="flex items-center text-sm" [style.color]="colors[2]">
                  <span
                    class="inline-block w-3 h-3 rounded-full mr-2"
                    [style.background]="colors[4]"
                  ></span>
                  {{ benefit }}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Tabla CRUD en un recuadro aparte debajo, con el mismo ancho -->
  <div class="relative py-3 sm:max-w-6xl sm:mx-auto mt-8">
    <div class="absolute inset-0 bg-card border-2 border-green-500 shadow-lg rounded-3xl"></div>
    <div class="relative px-4 py-10 bg-card border-2 border-green-500 shadow-lg rounded-3xl sm:p-12 w-full">
      <h2 class="text-lg font-semibold text-green-400 mb-4">Tus selecciones</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full bg-card border border-green-500 rounded-lg">
          <thead>
            <tr>
              <th *ngFor="let i of [0,1,2,3,4]" class="px-2 py-2 text-green-400 border-b border-green-500">
                Color {{ i + 1 }}
              </th>
              <th class="px-2 py-2 text-green-400 border-b border-green-500">Predeterminado</th>
              <th class="px-2 py-2 text-green-400 border-b border-green-500">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="savedColors.length === 0">
              <td colspan="7" class="text-center text-gray-400 py-4">
                No hay selecciones guardadas.
              </td>
            </tr>
            <tr *ngFor="let row of savedColors; let rowIdx = index">
              <td *ngFor="let color of [row.color_1, row.color_2, row.color_3, row.color_4, row.color_5]" class="px-2 py-2 text-center">
                <span
                  class="inline-block w-6 h-6 rounded-full border-2 border-green-500"
                  [style.background]="color"
                  [title]="color"
                ></span>
                <span class="ml-2 text-xs text-gray-300">{{ color }}</span>
              </td>
              <td class="px-2 py-2 text-center">
                <button
                  (click)="row.predeterminado !== 1 ? handleToggleDefault(row.id) : null"
                  class="p-1 rounded transition-colors"
                  [class]="row.predeterminado === 1 ? 'bg-yellow-500/20 hover:bg-yellow-500/30' : 'hover:bg-gray-700'"
                  [title]="row.predeterminado === 1 ? 'Predeterminado' : 'Establecer como predeterminado'"
                  [disabled]="row.predeterminado === 1"
                  [style.cursor]="row.predeterminado === 1 ? 'default' : 'pointer'"
                >
                  <svg 
                    width="16" 
                    height="16" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2"
                    [class]="row.predeterminado === 1 ? 'text-yellow-400 fill-yellow-400' : 'text-gray-400'"
                  >
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                  </svg>
                </button>
              </td>
              <td class="px-2 py-2 flex gap-2 justify-center">
                <button
                  (click)="handleEdit(rowIdx)"
                  class="p-1 rounded hover:bg-green-700"
                  title="Modificar"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-green-400">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                </button>
                <button
                  (click)="handleDelete(row.id)"
                  class="p-1 rounded hover:bg-red-700"
                  title="Eliminar"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-red-400">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
