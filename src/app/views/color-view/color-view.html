<div class="min-h-screen bg-background py-8">
  <div class="container mx-auto px-4">
    <div class="bg-card rounded-xl shadow-sm border p-6 md:p-8">
      <h1 class="text-2xl font-semibold text-green-400 text-center mb-6">
        Selecciona tus colores
      </h1>
      <div class="flex flex-col lg:flex-row gap-8 margin-x-auto justify-between">
        <!-- Colores -->
        <div class="flex-1 gap-6">
          <div class="mt-6 w-full flex flex-col items-center">
            <div *ngFor="let color of colors; let i = index" class="flex items-center space-x-4 mb-4">
              <label [for]="'color-' + i" class="text-gray-200 font-medium">
                Color {{ i + 1 }}:
              </label>
              <input
                type="color"
                [id]="'color-' + i"
                [name]="'color_' + (i + 1)"
                [value]="color"
                (input)="handleColorChange(i, $any($event.target).value)"
                class="w-8 h-8 rounded-full shadow-inner border-2 border-green-500 bg-[#23272e] cursor-pointer"
              />
              <span class="text-gray-300 font-mono">{{ color }}</span>
            </div>
            <div class="flex justify-between mt-8 gap-4">
              <button
                (click)="editRow !== null ? handleUpdate() : handleSave()"
                class="bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 rounded-md font-medium transition-colors"
              >
                {{ editRow !== null ? "Actualizar" : "Guardar selección" }}
              </button>
              <button
                (click)="goToHome()"
                class="bg-secondary text-secondary-foreground hover:bg-secondary/80 h-10 px-4 py-2 rounded-md font-medium transition-colors border border-border"
              >
                Regresar
              </button>
              <button
                (click)="goToFonts()"
                class="bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 rounded-md font-medium transition-colors"
              >
                Ir a Fuentes
              </button>
            </div>
          </div>
        </div>
        <!-- HeroCard Preview con estructura igual a HeroCards -->
        <div class="flex-1 flex flex-col items-center w-full mt-8 lg:mt-0 border-2 border-radius-lg p-3">
          <div
            class=" border-radius-lg p-3 max-w-[340px] rounded-2xl border-4 shadow-lg p-0 mx-auto transition-all"
            [style.background]="'linear-gradient(135deg, ' + colors[0] + ', ' + colors[1] + ')'"
            [style.color]="colors[2]"
            [style.borderColor]="colors[3]"
            [style.boxShadow]="'0 0 20px 2px ' + colors[4] + '55'"
          >
            <div class="flex flex-row items-center gap-4 p-6 pb-2">
              <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm">
                <div [style.background]="colors[1]" [style.color]="colors[2]" class="w-full h-full rounded-full flex items-center justify-center">
                  EG
                </div>
              </div>
              <div class="flex flex-col">
                <span class="font-bold text-lg" [style.color]="colors[2]">Enrique Gonzalez</span>
                <span class="text-sm" [style.color]="colors[2]">&#64;kikegonza</span>
              </div>
            </div>
            <div class="px-6 pb-4" [style.color]="colors[2]">
              Funciona perfecto!
            </div>
            <div class="px-6 pb-4 flex flex-col items-start">
              <div
                class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2"
                [style.background]="colors[3]"
                [style.color]="colors[1]"
                [style.borderColor]="colors[4]"
              >
                el mas popular
              </div>
              <div class="mt-2">
                <span class="text-3xl font-bold" [style.color]="colors[2]">$0</span>
                <span class="ml-2 text-muted-foreground" [style.color]="colors[2]"> /month</span>
              </div>
              <div class="mt-2 text-sm" [style.color]="colors[2]">
                Lorem ipsum dolor sit, amet ipsum consectetur adipisicing elit.
              </div>
            </div>
            <div class="px-6 pb-4">
              <button
                class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 w-full"
                [style.background]="colors[3]"
                [style.color]="colors[1]"
                [style.borderColor]="colors[4]"
                [style.border]="'2px solid ' + colors[4]"
              >
                Empezar prueba ahora
              </button>
            </div>
            <hr class="w-4/5 m-auto mb-4" [style.borderColor]="colors[4]" />
            <div class="px-6 pb-6">
              <div class="space-y-2">
                <div *ngFor="let benefit of ['4 Team member', '4 GB Storage', 'Upto 6 pages']" class="flex items-center text-sm" [style.color]="colors[2]">
                  <span
                    class="inline-block w-3 h-3 rounded-full mr-2"
                    [style.background]="colors[4]"
                  ></span>
                  {{ benefit }}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Saved Colors Table -->
  <div class="container mx-auto px-4 mt-8 mb-12">
    <div class="bg-card rounded-xl shadow-sm border p-6 md:p-8">
      <h2 class="text-2xl font-semibold text-foreground mb-6">Tus selecciones</h2>
      <div class="overflow-x-auto rounded-lg border">
        <table class="w-full">
          <thead>
            <tr class="border-b">
              <th *ngFor="let i of [0,1,2,3,4]" class="px-4 py-3 text-left text-sm font-medium text-muted-foreground">
                Color {{ i + 1 }}
              </th>
              <th class="px-4 py-3 text-left text-sm font-medium text-muted-foreground">Predeterminado</th>
              <th class="px-4 py-3 text-left text-sm font-medium text-muted-foreground">Acciones</th>
            </tr>
          </thead>
          <tbody class="divide-y">
            <tr *ngIf="savedColors.length === 0">
              <td colspan="7" class="px-4 py-6 text-center text-sm text-muted-foreground">
                No hay selecciones guardadas.
              </td>
            </tr>
            <tr *ngFor="let row of savedColors; let rowIdx = index" class="hover:bg-muted/50">
              <td *ngFor="let color of [row.color_1, row.color_2, row.color_3, row.color_4, row.color_5]" class="px-4 py-3 text-sm">
                <div class="flex items-center gap-2">
                  <span
                    class="inline-block h-5 w-5 rounded-full border-2 border-border"
                    [style.background]="color"
                    [title]="color"
                  ></span>
                  <span class="text-muted-foreground font-mono text-xs">{{ color }}</span>
                </div>
              </td>
              <td class="px-4 py-3 text-sm">
                <button
                  (click)="row.predeterminado !== 1 ? handleToggleDefault(row.id) : null"
                  class="p-1.5 rounded-md transition-colors"
                  [class]="row.predeterminado === 1 ? 'text-yellow-500 hover:bg-yellow-500/10' : 'text-muted-foreground hover:bg-accent'"
                  [title]="row.predeterminado === 1 ? 'Predeterminado' : 'Establecer como predeterminado'"
                  [disabled]="row.predeterminado === 1"
                >
                  <svg 
                    width="18" 
                    height="18" 
                    viewBox="0 0 24 24" 
                    fill="currentColor" 
                    stroke="currentColor" 
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    [class]="row.predeterminado === 1 ? 'fill-yellow-500' : 'fill-none'"
                  >
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                  </svg>
                </button>
              </td>
              <td class="px-4 py-3 text-sm">
                <div class="flex items-center gap-2">
                  <button
                    (click)="handleEdit(rowIdx)"
                    class="p-1.5 rounded-md text-muted-foreground hover:bg-accent hover:text-foreground transition-colors"
                    title="Modificar"
                  >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                  </button>
                  <button
                    (click)="handleDelete(row.id)"
                    class="p-1.5 rounded-md text-muted-foreground hover:bg-destructive/10 hover:text-destructive transition-colors"
                    title="Eliminar"
                  >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="3 6 5 6 21 6"></polyline>
                      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                      <line x1="10" y1="11" x2="10" y2="17"></line>
                      <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
