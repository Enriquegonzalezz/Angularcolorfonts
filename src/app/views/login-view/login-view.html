<app-navbar></app-navbar>
<div class="login-container">
  <div class="login-card">
    <div class="login-card-border"></div>
    <div class="login-card-content">
      <div class="login-header">
        <h1 class="login-title">Login to your account</h1>
        <p class="login-subtitle">Welcome back! Please login to continue.</p>
      </div>

      <div class="error-message" *ngIf="error">
        {{ error }}
      </div>

      <form (submit)="handleSubmit($event)" class="login-form">
        <div class="form-group">
          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="formData.email"
            (input)="handleChange($event)"
            class="form-input"
            placeholder="Email address"
            required>
          <span class="input-hint">Enter your email</span>
        </div>

        <div class="form-group">
          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="formData.password"
            (input)="handleChange($event)"
            class="form-input"
            placeholder="Password"
            required
            minlength="6">
          <span class="input-hint">At least 6 characters</span>
        </div>

        <button
          type="submit"
          class="login-button"
          [disabled]="isLoading">
          <span *ngIf="isLoading" class="loading-spinner">
            <svg class="spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="spinner-circle" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="spinner-path" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Processing...
          </span>
          <span *ngIf="!isLoading">Login</span>
        </button>
      </form>

      <div class="login-footer">
        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">OR</span>
          <div class="divider-line"></div>
        </div>

        <p class="signup-text">
          Don't have an account?
          <a routerLink="/signup" class="signup-link">Sign up now</a>
        </p>
      </div>
    </div>
  </div>
</div>
